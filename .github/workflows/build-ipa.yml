name: Build zooma cloudy IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Download Sing-box Libbox framework
      run: |
        mkdir -p Frameworks
        echo "Downloading Libbox.xcframework..."
        curl -L -o Libbox.xcframework.zip "https://github.com/EbrahimTahernejad/sing-box-lib/releases/download/1.11.11/Libbox.xcframework.zip"
        unzip -q Libbox.xcframework.zip -d Frameworks
        ls -la Frameworks/
        find Frameworks/ -name "*.h"

    - name: Inspect Libbox Headers
      run: |
        HEADER=$(find Frameworks/ -name "Libbox.h" | head -n 1)
        if [ -n "$HEADER" ]; then
          echo "=== Found Libbox.h at: $HEADER ==="
          echo "=== SEARCHING FOR PlatformInterface in $HEADER ==="
          grep -n -C 5 "PlatformInterface" "$HEADER" || true
          echo "=== SEARCHING FOR NewService in $HEADER ==="
          grep -n -C 5 "NewService" "$HEADER" || true
          echo "=== ALL EXPORTED FUNCTIONS IN Libbox.h ==="
          grep -n "^FOUNDATION_EXPORT" "$HEADER" || true
        fi

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build App & PacketTunnel Extension
      run: |
        set -o pipefail
        xcodebuild -project "zooma_cloudy.xcodeproj" \
          -scheme "zooma_cloudy" \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath derived_data \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log || {
            echo "=========================================="
            echo "=== XCODEBUILD FAILED! EXTRACTING ERRORS ==="
            echo "=========================================="
            grep -C 3 -E "(error:|fatal error:)" xcodebuild.log | tail -n 80
            exit 1
          }

    - name: Package IPA
      run: |
        rm -rf Payload
        mkdir -p Payload
        
        APP_PATH=$(find derived_data/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
        echo "Found compiled app at: $APP_PATH"
        
        # Копируем приложение в Payload
        cp -R "$APP_PATH" Payload/zooma_cloudy.app
        chmod -R 777 Payload/
        
        # Настройка и валидация PacketTunnel.appex внутри PlugIns
        if [ -d "Payload/zooma_cloudy.app/PlugIns/PacketTunnel.appex" ]; then
          echo "Configuring PacketTunnel.appex Info.plist..."
          cp -f PacketTunnel/Info.plist Payload/zooma_cloudy.app/PlugIns/PacketTunnel.appex/Info.plist
          plutil -replace CFBundleExecutable -string "PacketTunnel" Payload/zooma_cloudy.app/PlugIns/PacketTunnel.appex/Info.plist
          plutil -replace CFBundleIdentifier -string "com.zoomacloudy.app.PacketTunnel" Payload/zooma_cloudy.app/PlugIns/PacketTunnel.appex/Info.plist
          plutil -replace CFBundleShortVersionString -string "1.0.0" Payload/zooma_cloudy.app/PlugIns/PacketTunnel.appex/Info.plist
          plutil -replace CFBundleVersion -string "1" Payload/zooma_cloudy.app/PlugIns/PacketTunnel.appex/Info.plist
          plutil -convert binary1 Payload/zooma_cloudy.app/PlugIns/PacketTunnel.appex/Info.plist
          
          # Внедряем Libbox.framework в PacketTunnel.appex/Frameworks
          LIBBOX_FRAMEWORK=$(find Frameworks/ -name "Libbox.framework" -path "*/ios-arm64/*" | head -n 1)
          if [ -n "$LIBBOX_FRAMEWORK" ]; then
            echo "Embedding Libbox.framework from $LIBBOX_FRAMEWORK into PacketTunnel..."
            mkdir -p Payload/zooma_cloudy.app/PlugIns/PacketTunnel.appex/Frameworks
            cp -R "$LIBBOX_FRAMEWORK" Payload/zooma_cloudy.app/PlugIns/PacketTunnel.appex/Frameworks/
          fi
        fi
        
        # Внедряем Libbox.framework в Main App Frameworks
        LIBBOX_FRAMEWORK=$(find Frameworks/ -name "Libbox.framework" -path "*/ios-arm64/*" | head -n 1)
        if [ -n "$LIBBOX_FRAMEWORK" ]; then
          echo "Embedding Libbox.framework into Main App..."
          mkdir -p Payload/zooma_cloudy.app/Frameworks
          cp -R "$LIBBOX_FRAMEWORK" Payload/zooma_cloudy.app/Frameworks/
        fi
        
        # Перезаписываем Info.plist основного приложения
        cp -f HappVPN/Info.plist Payload/zooma_cloudy.app/Info.plist
        
        # Принудительно устанавливаем свойства для иконки и названий
        plutil -replace CFBundleDisplayName -string "zooma cloudy" Payload/zooma_cloudy.app/Info.plist
        plutil -replace CFBundleName -string "zooma_cloudy" Payload/zooma_cloudy.app/Info.plist
        plutil -replace CFBundleExecutable -string "zooma_cloudy" Payload/zooma_cloudy.app/Info.plist
        plutil -replace CFBundleIdentifier -string "com.zoomacloudy.app" Payload/zooma_cloudy.app/Info.plist
        plutil -replace CFBundleShortVersionString -string "1.0.0" Payload/zooma_cloudy.app/Info.plist
        plutil -replace CFBundleVersion -string "1" Payload/zooma_cloudy.app/Info.plist
        plutil -replace CFBundleIconFile -string "AppIcon" Payload/zooma_cloudy.app/Info.plist
        plutil -replace CFBundleIconName -string "AppIcon" Payload/zooma_cloudy.app/Info.plist
        plutil -replace UILaunchStoryboardName -string "LaunchScreen" Payload/zooma_cloudy.app/Info.plist
        
        # Копируем иконки во всех стандартных форматах iOS
        ICON_DIR="HappVPN/Assets.xcassets/AppIcon.appiconset"
        cp -f "$ICON_DIR/AppIcon-1024.png" Payload/zooma_cloudy.app/AppIcon.png
        cp -f "$ICON_DIR/AppIcon-1024.png" Payload/zooma_cloudy.app/Icon.png
        cp -f "$ICON_DIR/AppIcon60x60@2x.png" Payload/zooma_cloudy.app/AppIcon60x60@2x.png
        cp -f "$ICON_DIR/AppIcon60x60@3x.png" Payload/zooma_cloudy.app/AppIcon60x60@3x.png
        cp -f "$ICON_DIR/AppIcon76x76@2x~ipad.png" Payload/zooma_cloudy.app/AppIcon76x76@2x~ipad.png
        
        # Компилируем Info.plist в бинарный формат iOS
        plutil -convert binary1 Payload/zooma_cloudy.app/Info.plist
        
        # Проставляем Ad-Hoc подпись для валидной структуры пакета под Feather/sideloading
        if [ -d "Payload/zooma_cloudy.app/Frameworks/Libbox.framework" ]; then
          codesign --force --sign - --timestamp=none Payload/zooma_cloudy.app/Frameworks/Libbox.framework || true
        fi
        if [ -d "Payload/zooma_cloudy.app/PlugIns/PacketTunnel.appex/Frameworks/Libbox.framework" ]; then
          codesign --force --sign - --timestamp=none Payload/zooma_cloudy.app/PlugIns/PacketTunnel.appex/Frameworks/Libbox.framework || true
        fi
        if [ -d "Payload/zooma_cloudy.app/PlugIns/PacketTunnel.appex" ]; then
          codesign --force --sign - --timestamp=none --entitlements PacketTunnel/PacketTunnel.entitlements Payload/zooma_cloudy.app/PlugIns/PacketTunnel.appex || true
        fi
        codesign --force --sign - --timestamp=none --entitlements HappVPN/zooma_cloudy.entitlements Payload/zooma_cloudy.app || true
        
        # Выводим верификацию в лог сборки
        echo "=== VERIFIED APP STRUCTURE IN PAYLOAD ==="
        ls -la Payload/zooma_cloudy.app
        if [ -d "Payload/zooma_cloudy.app/PlugIns" ]; then
          ls -la Payload/zooma_cloudy.app/PlugIns
        fi
        
        # Архивируем в .ipa
        zip -r -y "zooma-cloudy.ipa" Payload
        ls -la "zooma-cloudy.ipa"

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zooma-cloudy-ipa
        path: "zooma-cloudy.ipa"

    - name: Publish Direct IPA to GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
      with:
        tag_name: v1.0.9
        name: "zooma cloudy v1.0.9"
        body: "Полноценный клиент VLESS Reality на ядре sing-box (Libbox.xcframework) с профилем в «VPN устройства» через NETunnelProviderManager, реальный TCP пинг, полноэкранный интерфейс."
        files: zooma-cloudy.ipa
        prerelease: false
        make_latest: true
        overwrite: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
