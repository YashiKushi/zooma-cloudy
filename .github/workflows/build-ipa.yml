name: Build zooma cloudy IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build App
      run: |
        xcodebuild -project "zooma_cloudy.xcodeproj" \
          -scheme "zooma_cloudy" \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath derived_data \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Package IPA
      run: |
        rm -rf Payload
        mkdir -p Payload
        
        APP_PATH=$(find derived_data/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
        echo "Found compiled app at: $APP_PATH"
        
        # Копируем приложение в Payload
        cp -R "$APP_PATH" Payload/zooma_cloudy.app
        
        # Гарантированно перезаписываем Info.plist нашим чистым манифестом
        cp HappVPN/Info.plist Payload/zooma_cloudy.app/Info.plist
        
        # Принудительно устанавливаем точные строковые значения через plutil
        plutil -replace CFBundleDisplayName -string "zooma cloudy" Payload/zooma_cloudy.app/Info.plist
        plutil -replace CFBundleName -string "zooma_cloudy" Payload/zooma_cloudy.app/Info.plist
        plutil -replace CFBundleExecutable -string "zooma_cloudy" Payload/zooma_cloudy.app/Info.plist
        plutil -replace CFBundleIdentifier -string "com.zoomacloudy.app" Payload/zooma_cloudy.app/Info.plist
        plutil -replace CFBundleShortVersionString -string "1.0.0" Payload/zooma_cloudy.app/Info.plist
        
        # Компилируем в бинарный plist формат iOS
        plutil -convert binary1 Payload/zooma_cloudy.app/Info.plist
        
        # Выводим в лог для стопроцентной проверки
        echo "=== VERIFIED PLIST IN PAYLOAD ==="
        plutil -p Payload/zooma_cloudy.app/Info.plist
        
        # Копируем иконки в корень бандла
        if [ -f "HappVPN/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png" ]; then
          cp HappVPN/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png Payload/zooma_cloudy.app/AppIcon60x60@2x.png
          cp HappVPN/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png Payload/zooma_cloudy.app/AppIcon60x60@3x.png
          cp HappVPN/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png Payload/zooma_cloudy.app/AppIcon.png
        fi
        
        # Архивируем в .ipa
        zip -r -y "zooma-cloudy.ipa" Payload
        ls -la "zooma-cloudy.ipa"

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zooma-cloudy-ipa
        path: "zooma-cloudy.ipa"

    - name: Publish Direct IPA to GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
      with:
        tag_name: v1.0.1
        name: "zooma cloudy v1.0.1"
        body: "Прямая ссылка на готовый .ipa файл для установки через Feather."
        files: zooma-cloudy.ipa
        prerelease: false
        make_latest: true
        overwrite: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
