name: Build zooma cloudy IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build App
      run: |
        xcodebuild -project "zooma cloudy.xcodeproj" \
          -scheme "zooma cloudy" \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath derived_data \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Package IPA
      run: |
        mkdir -p Payload
        APP_PATH=$(find derived_data/Build/Products/Release-iphoneos -name "*.app" -type d -maxdepth 1 | head -n 1)
        echo "Found compiled app bundle at: $APP_PATH"
        
        # Гарантируем корректный Info.plist внутри .app
        cp HappVPN/Info.plist "$APP_PATH/Info.plist"
        
        # Копируем в Payload для формирования валидного IPA
        cp -r "$APP_PATH" Payload/
        zip -r "zooma-cloudy.ipa" Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zooma-cloudy-ipa
        path: "zooma-cloudy.ipa"
