name: Build HappVPN IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build App
      run: |
        xcodebuild -project HappVPN.xcodeproj \
          -scheme HappVPN \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath derived_data \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Package IPA
      run: |
        mkdir -p Payload
        APP_PATH=$(find derived_data/Build/Products/Release-iphoneos -name "HappVPN.app" -type d | head -n 1)
        echo "Found app at: $APP_PATH"
        
        # Проверка наличия Info.plist
        if [ ! -f "$APP_PATH/Info.plist" ]; then
          echo "Copying Info.plist directly into bundle..."
          cp HappVPN/Info.plist "$APP_PATH/Info.plist"
        fi
        
        cp -r "$APP_PATH" Payload/
        zip -r HappVPN.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HappVPN-ipa
        path: HappVPN.ipa
