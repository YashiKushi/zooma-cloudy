name: HappVPN
options:
  bundleIdPrefix: com.happ.vpn
  deploymentTarget:
    iOS: "16.0"
targets:
  HappVPN:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: HappVPN
    info:
      path: HappVPN/Info.plist
    dependencies:
      - target: PacketTunnel
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.happ.vpn.client
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: HappVPN/Info.plist
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
  PacketTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: PacketTunnel
    info:
      path: PacketTunnel/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.happ.vpn.PacketTunnel
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: PacketTunnel/Info.plist
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
