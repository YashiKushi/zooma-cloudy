name: zooma_cloudy
options:
  bundleIdPrefix: com.zoomacloudy
  deploymentTarget:
    iOS: "15.0"
targets:
  zooma_cloudy:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: HappVPN
        excludes:
          - "Info.plist"
    info:
      path: HappVPN/Info.plist
    settings:
      PRODUCT_NAME: "zooma_cloudy"
      PRODUCT_BUNDLE_IDENTIFIER: com.zoomacloudy.app
      INFOPLIST_FILE: HappVPN/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      CODE_SIGN_ENTITLEMENTS: HappVPN/zooma_cloudy.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
