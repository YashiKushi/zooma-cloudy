name: HappVPN
options:
  bundleIdPrefix: com.happ.vpn
  deploymentTarget:
    iOS: "16.0"
targets:
  HappVPN:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: HappVPN
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.happ.vpn.client
      INFOPLIST_KEY_CFBundleDisplayName: "Happ VPN"
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
  PacketTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: PacketTunnel
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.happ.vpn.PacketTunnel
      GENERATE_INFOPLIST_KEY_CFBundleDisplayName: "PacketTunnel"
