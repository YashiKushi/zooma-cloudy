name: "zooma cloudy"
options:
  bundleIdPrefix: com.zoomacloudy
  deploymentTarget:
    iOS: "15.0"
targets:
  "zooma cloudy":
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: HappVPN
    info:
      path: HappVPN/Info.plist
    dependencies:
      - target: PacketTunnel
    settings:
      PRODUCT_NAME: "zooma cloudy"
      PRODUCT_BUNDLE_IDENTIFIER: com.zoomacloudy.app
      INFOPLIST_FILE: HappVPN/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
  PacketTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: PacketTunnel
    info:
      path: PacketTunnel/Info.plist
    settings:
      PRODUCT_NAME: "PacketTunnel"
      PRODUCT_BUNDLE_IDENTIFIER: com.zoomacloudy.app.PacketTunnel
      INFOPLIST_FILE: PacketTunnel/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
